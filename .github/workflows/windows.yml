name: Windows portable build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - run: ./build.ps1
      - run: ./tests/build.test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Hyper-Terminal-Windows-portable
          path: dist/HyperTerminal-Foot/
          include-hidden-files: true
